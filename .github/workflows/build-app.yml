name: Build MakLock.app

on:
  workflow_dispatch:
  push:
    branches: [tahoe-fixes]
    tags: ['v*']

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-15

    steps:
      - uses: actions/checkout@v4

      - name: Xcode version
        run: xcodebuild -version

      - name: Import signing certificate
        env:
          MACOS_CERT_P12: ${{ secrets.MACOS_CERT_P12 }}
          MACOS_CERT_PASSWORD: ${{ secrets.MACOS_CERT_PASSWORD }}
        run: |
          KEYCHAIN_PATH="$RUNNER_TEMP/build.keychain-db"
          echo "KEYCHAIN_PATH=$KEYCHAIN_PATH" >> "$GITHUB_ENV"
          KEYCHAIN_PASSWORD=$(uuidgen)
          echo "$MACOS_CERT_P12" | base64 --decode > "$RUNNER_TEMP/cert.p12"
          curl -sSfL -o "$RUNNER_TEMP/DeveloperIDG2CA.cer" https://www.apple.com/certificateauthority/DeveloperIDG2CA.cer

          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security import "$RUNNER_TEMP/DeveloperIDG2CA.cer" -k "$KEYCHAIN_PATH" -T /usr/bin/codesign
          security import "$RUNNER_TEMP/cert.p12" -P "$MACOS_CERT_PASSWORD" -A -t cert -f pkcs12 -k "$KEYCHAIN_PATH"
          security set-key-partition-list -S apple-tool:,apple: -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security list-keychain -d user -s "$KEYCHAIN_PATH" login.keychain-db

          rm -f "$RUNNER_TEMP/cert.p12"
          security find-identity -v -p codesigning "$KEYCHAIN_PATH"

      - name: Resolve packages
        run: xcodebuild -resolvePackageDependencies -project MakLock.xcodeproj -scheme MakLock

      - name: Build Release (Developer ID signed)
        env:
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          xcodebuild build \
            -project MakLock.xcodeproj \
            -scheme MakLock \
            -configuration Release \
            -destination "platform=macOS" \
            -derivedDataPath build \
            CODE_SIGN_STYLE=Manual \
            CODE_SIGN_IDENTITY="Developer ID Application" \
            DEVELOPMENT_TEAM="$APPLE_TEAM_ID" \
            ENABLE_HARDENED_RUNTIME=YES \
            CODE_SIGN_INJECT_BASE_ENTITLEMENTS=NO \
            OTHER_CODE_SIGN_FLAGS="--timestamp"

      - name: Re-sign nested components
        run: |
          APP=build/Build/Products/Release/MakLock.app
          IDENTITY="Developer ID Application"
          SIGN="codesign --force --options runtime --timestamp --preserve-metadata=entitlements --sign"
          FW="$APP/Contents/Frameworks/Sparkle.framework/Versions/B"
          if [ -d "$FW" ]; then
            for item in "$FW"/XPCServices/*.xpc "$FW"/Autoupdate "$FW"/Updater.app; do
              [ -e "$item" ] && $SIGN "$IDENTITY" "$item"
            done
            $SIGN "$IDENTITY" "$FW"
          fi
          find "$APP/Contents/Frameworks" -maxdepth 1 -name "*.framework" ! -name "Sparkle.framework" -print0 \
            | xargs -0 -I{} $SIGN "$IDENTITY" "{}"
          codesign --force --options runtime --timestamp \
            --entitlements MakLock/Resources/MakLock.entitlements \
            --sign "$IDENTITY" "$APP"

      - name: Verify signature
        run: |
          APP=build/Build/Products/Release/MakLock.app
          codesign --verify --deep --strict --verbose=2 "$APP"
          echo "===== App signature ====="
          codesign -dvv "$APP" 2>&1 | grep -E "Authority=|TeamIdentifier|Timestamp|flags="
          echo "===== App entitlements ====="
          codesign -d --entitlements - --xml "$APP" | plutil -p -
          echo "===== Sparkle nested signatures ====="
          for item in "$APP"/Contents/Frameworks/Sparkle.framework/Versions/B/XPCServices/*.xpc \
                      "$APP"/Contents/Frameworks/Sparkle.framework/Versions/B/Autoupdate \
                      "$APP"/Contents/Frameworks/Sparkle.framework/Versions/B/Updater.app; do
            [ -e "$item" ] || continue
            echo "--- $item"
            codesign -dvv "$item" 2>&1 | grep -E "Authority=Developer|TeamIdentifier|flags="
          done

      - name: Notarize
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
        run: |
          cd build/Build/Products/Release
          echo "$ASC_KEY_P8" | base64 --decode > "$RUNNER_TEMP/AuthKey.p8"
          ditto -c -k --keepParent MakLock.app MakLock-notarize.zip
          SUBMISSION_ID=$(xcrun notarytool submit MakLock-notarize.zip \
            --key "$RUNNER_TEMP/AuthKey.p8" \
            --key-id "$ASC_KEY_ID" \
            --issuer "$ASC_ISSUER_ID" \
            --output-format json | python3 -c "import json,sys; print(json.load(sys.stdin)['id'])")
          echo "Submission: $SUBMISSION_ID"
          xcrun notarytool wait "$SUBMISSION_ID" \
            --key "$RUNNER_TEMP/AuthKey.p8" \
            --key-id "$ASC_KEY_ID" \
            --issuer "$ASC_ISSUER_ID"
          echo "===== Notarization log ====="
          xcrun notarytool log "$SUBMISSION_ID" \
            --key "$RUNNER_TEMP/AuthKey.p8" \
            --key-id "$ASC_KEY_ID" \
            --issuer "$ASC_ISSUER_ID"
          STATUS=$(xcrun notarytool info "$SUBMISSION_ID" \
            --key "$RUNNER_TEMP/AuthKey.p8" \
            --key-id "$ASC_KEY_ID" \
            --issuer "$ASC_ISSUER_ID" \
            --output-format json | python3 -c "import json,sys; print(json.load(sys.stdin)['status'])")
          echo "Status: $STATUS"
          [ "$STATUS" = "Accepted" ] || exit 1
          xcrun stapler staple MakLock.app
          xcrun stapler validate MakLock.app
          spctl -a -t exec -vv MakLock.app
          rm -f MakLock-notarize.zip "$RUNNER_TEMP/AuthKey.p8"

      - name: Create and notarize DMG
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
        run: |
          cd build/Build/Products/Release
          echo "$ASC_KEY_P8" | base64 --decode > "$RUNNER_TEMP/AuthKey.p8"
          mkdir dmg-root
          cp -R MakLock.app dmg-root/
          ln -s /Applications dmg-root/Applications
          hdiutil create -volname "MakLock" -srcfolder dmg-root -ov -format UDZO MakLock.dmg
          codesign --sign "Developer ID Application" --timestamp MakLock.dmg
          SUBMISSION_ID=$(xcrun notarytool submit MakLock.dmg \
            --key "$RUNNER_TEMP/AuthKey.p8" \
            --key-id "$ASC_KEY_ID" \
            --issuer "$ASC_ISSUER_ID" \
            --output-format json | python3 -c "import json,sys; print(json.load(sys.stdin)['id'])")
          xcrun notarytool wait "$SUBMISSION_ID" \
            --key "$RUNNER_TEMP/AuthKey.p8" \
            --key-id "$ASC_KEY_ID" \
            --issuer "$ASC_ISSUER_ID"
          echo "===== Notarization log ====="
          xcrun notarytool log "$SUBMISSION_ID" \
            --key "$RUNNER_TEMP/AuthKey.p8" \
            --key-id "$ASC_KEY_ID" \
            --issuer "$ASC_ISSUER_ID"
          STATUS=$(xcrun notarytool info "$SUBMISSION_ID" \
            --key "$RUNNER_TEMP/AuthKey.p8" \
            --key-id "$ASC_KEY_ID" \
            --issuer "$ASC_ISSUER_ID" \
            --output-format json | python3 -c "import json,sys; print(json.load(sys.stdin)['status'])")
          echo "Status: $STATUS"
          [ "$STATUS" = "Accepted" ] || exit 1
          xcrun stapler staple MakLock.dmg
          xcrun stapler validate MakLock.dmg
          spctl -a -t open --context context:primary-signature -vv MakLock.dmg
          rm -f "$RUNNER_TEMP/AuthKey.p8"

      - uses: actions/upload-artifact@v4
        with:
          name: MakLock-dmg
          path: build/Build/Products/Release/MakLock.dmg
          if-no-files-found: error

      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            build/Build/Products/Release/MakLock.dmg \
            --title "MakLock $GITHUB_REF_NAME (community fixes)" \
            --notes "Unofficial build with fixes for macOS Tahoe. Signed and notarized. See README for what's changed and how to install."

      - name: Remove signing keychain
        if: always()
        run: security delete-keychain "$KEYCHAIN_PATH" || true
